<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEPSE Live &mdash; Floor Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0F1115;
    --surface: #171A21;
    --surface-2: #1E222B;
    --border: #2A2F3A;
    --text: #E8E6E1;
    --muted: #8B92A0;
    --accent: #DC143C;
    --up: #2FBF71;
    --down: #E5484D;
    --gold: #E8B84B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); display: inline-block;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: 0.02em; margin: 0;
  }

  .header-right { display: flex; align-items: center; gap: 18px; }

  .status {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted);
  }

  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pulse.open {
    background: var(--up);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(47,191,113, 0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(47,191,113, 0); }
    100% { box-shadow: 0 0 0 0 rgba(47,191,113, 0); }
  }

  .toggle-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 12px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .toggle-btn.active {
    color: var(--gold);
    border-color: var(--gold);
  }
  .toggle-btn:hover { background: var(--surface-2); }

  main { max-width: 1000px; margin: 0 auto; padding: 28px; }

  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
  }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    text-align: right;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 500;
    padding: 12px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  thead th:first-child, tbody td:first-child { text-align: left; }
  thead th:nth-child(2), tbody td:nth-child(2) { text-align: center; width: 36px; }

  tbody td {
    padding: 11px 16px;
    text-align: right;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--border);
    transition: background-color 0.6s ease;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); cursor: pointer; }

  .symbol {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-align: left !important;
  }

  .star {
    cursor: pointer;
    font-size: 15px;
    color: var(--border);
    user-select: none;
  }
  .star.active { color: var(--gold); }
  .star:hover { color: var(--gold); }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }

  .flash-up { background-color: rgba(47,191,113,0.15) !important; }
  .flash-down { background-color: rgba(229,72,77,0.15) !important; }

  .empty-state {
    padding: 48px 16px; text-align: center; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  }

  footer {
    max-width: 1000px; margin: 0 auto; padding: 0 28px 28px;
    color: var(--muted); font-size: 12px; font-family: 'IBM Plex Mono', monospace;
  }

  /* Chart modal */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-backdrop.visible { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 100%;
    max-width: 640px;
    padding: 24px;
  }

  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }

  .modal-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px; margin: 0;
  }

  .modal-close {
    cursor: pointer; color: var(--muted); font-size: 20px;
    background: none; border: none; line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  .chart-empty {
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1><span class="mark"></span>NEPSE Live</h1>
  </div>
  <div class="header-right">
    <button class="toggle-btn" id="watchlist-toggle">&#9733; Watchlist only</button>
    <div class="status">
      <span class="pulse" id="pulse"></span>
      <span id="status-text">connecting&hellip;</span>
    </div>
  </div>
</header>

<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Symbol</th>
          <th></th>
          <th>LTP</th>
          <th>Change</th>
          <th>% Chg</th>
          <th>Qty</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="empty-state">Loading&hellip;</td></tr>
      </tbody>
    </table>
  </div>
</main>

<footer>
  Reads the latest generated snapshot &middot; sourced from NEPSE &middot; educational/personal use only, not investment advice &middot; history charts require optional Supabase
</footer>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Symbol</h2>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div id="chart-container">
      <canvas id="price-chart" height="220"></canvas>
    </div>
  </div>
</div>

<script>
  // Optional: leave blank to use frontend/data.json only.
  const SUPABASE_URL = "";
  const SUPABASE_ANON_KEY = "";
  const HAS_SUPABASE = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
  const REFRESH_MS = 30000;
  const previousPrices = {};
  let watchlistOnly = false;
  let chartInstance = null;
  let latestRows = [];
  let chartRequestId = 0;

  // --- Watchlist, stored in this browser only (localStorage) ---
  function getWatchlist() {
    try {
      const value = JSON.parse(localStorage.getItem("nepse_watchlist") || "[]");
      return Array.isArray(value) ? value : [];
    } catch {
      return [];
    }
  }
  function saveWatchlist(list) {
    localStorage.setItem("nepse_watchlist", JSON.stringify(list));
  }
  function toggleWatch(symbol) {
    const list = getWatchlist();
    const idx = list.indexOf(symbol);
    if (idx >= 0) list.splice(idx, 1); else list.push(symbol);
    saveWatchlist(list);
  }

  async function fetchJson(url, headers = {}) {
    const res = await fetch(url, { headers, cache: "no-store" });
    if (!res.ok) {
      let detail = "";
      try {
        const body = await res.json();
        detail = body.message || body.hint || body.error || "";
      } catch {
        // The status code is enough when the response body is not JSON.
      }
      throw new Error(`Data request failed (${res.status})${detail ? `: ${detail}` : ""}`);
    }
    return res.json();
  }

  function updateMarketStatus(isOpen, updatedAt) {
    const pulse = document.getElementById("pulse");
    const statusText = document.getElementById("status-text");
    pulse.classList.toggle("open", Boolean(isOpen));
    statusText.textContent = isOpen ? "market open" : "market closed";
    statusText.title = updatedAt
      ? `Data updated ${new Date(updatedAt).toLocaleString()}`
      : "Update time unavailable";
  }

  async function fetchStaticSnapshot() {
    const data = await fetchJson(`data.json?t=${Date.now()}`);
    if (!data || !Array.isArray(data.prices)) {
      throw new Error("frontend/data.json has an unexpected format");
    }
    latestRows = data.prices;
    updateMarketStatus(data.is_open, data.updated_at);
    renderRows(latestRows);
  }

  async function fetchStatus() {
    const data = await fetchJson(
      `${SUPABASE_URL}/rest/v1/nepse_market_status?select=is_open,updated_at&id=eq.1`,
      { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    );
    if (data && data[0]) {
      updateMarketStatus(data[0].is_open, data[0].updated_at);
    }
  }

  async function fetchPrices() {
    const rows = await fetchJson(
      `${SUPABASE_URL}/rest/v1/nepse_live_prices?select=*&order=symbol.asc`,
      { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    );
    if (!Array.isArray(rows)) throw new Error("Unexpected price response from Supabase");
    latestRows = rows;
    renderRows(latestRows);
  }

  function renderRows(rows) {
    const tbody = document.getElementById("rows");
    const watchlist = getWatchlist();

    let visible = rows || [];
    if (watchlistOnly) visible = visible.filter(r => watchlist.includes(r.symbol));

    if (!visible.length) {
      const msg = watchlistOnly
        ? "No watchlist symbols yet — click a star to add one."
        : "No data yet — run the scraper to populate this table.";
      tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${msg}</td></tr>`;
      return;
    }

    tbody.innerHTML = "";
    visible.forEach(r => {
      const tr = document.createElement("tr");
      const changeClass = r.point_change > 0 ? "up" : r.point_change < 0 ? "down" : "flat";
      const arrow = r.point_change > 0 ? "\u25B2" : r.point_change < 0 ? "\u25BC" : "";
      const starred = watchlist.includes(r.symbol);

      const star = document.createElement("span");
      star.className = `star${starred ? " active" : ""}`;
      star.dataset.symbol = String(r.symbol ?? "");
      star.textContent = "★";
      const starCell = document.createElement("td");
      starCell.appendChild(star);

      tr.append(
        makeCell(String(r.symbol ?? ""), "symbol"),
        starCell,
        makeCell(formatNum(r.ltp), "ltp-cell"),
        makeCell(`${arrow}${arrow ? " " : ""}${formatNum(r.point_change)}`, changeClass),
        makeCell(r.percent_change == null ? "—" : `${formatNum(r.percent_change)}%`, changeClass),
        makeCell(formatNum(r.total_qty))
      );

      const prev = previousPrices[r.symbol];
      if (prev !== undefined && prev !== r.ltp) {
        const ltpCell = tr.querySelector(".ltp-cell");
        ltpCell.classList.add(r.ltp > prev ? "flash-up" : "flash-down");
        setTimeout(() => ltpCell.classList.remove("flash-up", "flash-down"), 900);
      }
      previousPrices[r.symbol] = r.ltp;

      star.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleWatch(r.symbol);
        renderRows(rows); // re-render with updated star state
      });

      tr.addEventListener("click", () => openChart(r.symbol));

      tbody.appendChild(tr);
    });
  }

  function renderPriceError(error) {
    const tbody = document.getElementById("rows");
    tbody.textContent = "";
    const tr = document.createElement("tr");
    const td = makeCell(
      "Data unavailable — run the scraper to generate frontend/data.json.",
      "empty-state"
    );
    td.colSpan = 6;
    td.title = error?.message || "Unknown backend error";
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  function makeCell(text, className = "") {
    const td = document.createElement("td");
    if (className) td.className = className;
    td.textContent = text;
    return td;
  }

  function formatNum(n) {
    if (n === null || n === undefined || n === "") return "—";
    const value = Number(n);
    return Number.isFinite(value)
      ? value.toLocaleString("en-US", { maximumFractionDigits: 2 })
      : "—";
  }

  // --- Historical chart ---
  async function openChart(symbol) {
    const requestId = ++chartRequestId;
    document.getElementById("modal-title").textContent = symbol;
    document.getElementById("modal-backdrop").classList.add("visible");

    const container = document.getElementById("chart-container");
    container.className = "chart-empty";
    if (!HAS_SUPABASE) {
      container.textContent = "Price history requires the optional Supabase backend.";
      return;
    }
    container.textContent = "Loading history…";

    let history;
    try {
      const encodedSymbol = encodeURIComponent(symbol);
      history = await fetchJson(
        `${SUPABASE_URL}/rest/v1/nepse_price_history?symbol=eq.${encodedSymbol}&select=ltp,recorded_at&order=recorded_at.desc&limit=500`,
        { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
      );
    } catch (error) {
      if (requestId !== chartRequestId) return;
      container.textContent = "Could not load price history. Please try again.";
      console.error(error);
      return;
    }
    if (requestId !== chartRequestId) return;
    if (!Array.isArray(history)) {
      container.textContent = "Received an unexpected history response.";
      return;
    }
    history.reverse();

    if (!history.length) {
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }
      container.textContent = `No history yet for ${symbol} — check back after the scraper has run a few times.`;
      return;
    }
    container.className = "";
    container.textContent = "";
    const canvas = document.createElement("canvas");
    canvas.id = "price-chart";
    canvas.height = 220;
    container.appendChild(canvas);

    const labels = history.map(h => new Date(h.recorded_at).toLocaleString("en-US", {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
    }));
    const values = history.map(h => h.ltp);

    if (chartInstance) chartInstance.destroy();
    const ctx = canvas.getContext("2d");
    chartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: `${symbol} LTP`,
          data: values,
          borderColor: "#E8B84B",
          backgroundColor: "rgba(232,184,75,0.08)",
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.15,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#8B92A0", maxTicksLimit: 6 }, grid: { color: "#2A2F3A" } },
          y: { ticks: { color: "#8B92A0" }, grid: { color: "#2A2F3A" } }
        }
      }
    });
  }

  document.getElementById("modal-close").addEventListener("click", () => {
    chartRequestId++;
    document.getElementById("modal-backdrop").classList.remove("visible");
  });
  document.getElementById("modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "modal-backdrop") {
      chartRequestId++;
      e.target.classList.remove("visible");
    }
  });

  document.getElementById("watchlist-toggle").addEventListener("click", () => {
    watchlistOnly = !watchlistOnly;
    document.getElementById("watchlist-toggle").classList.toggle("active", watchlistOnly);
    renderRows(latestRows);
  });

  async function tick() {
    try {
      await fetchStaticSnapshot();
      return;
    } catch (staticError) {
      if (!HAS_SUPABASE) {
        renderPriceError(staticError);
        const statusText = document.getElementById("status-text");
        statusText.textContent = "data unavailable";
        statusText.title = staticError.message;
        console.error("Static data request failed:", staticError);
        return;
      }
      console.warn("Static data unavailable; trying Supabase:", staticError);
    }

    const [statusResult, pricesResult] = await Promise.allSettled([fetchStatus(), fetchPrices()]);

    if (statusResult.status === "rejected") {
      const statusText = document.getElementById("status-text");
      statusText.textContent = "backend unavailable";
      statusText.title = statusResult.reason?.message || "Could not reach Supabase";
      document.getElementById("pulse").classList.remove("open");
      console.error("Market status request failed:", statusResult.reason);
    }

    if (pricesResult.status === "rejected") {
      renderPriceError(pricesResult.reason);
      console.error("Price request failed:", pricesResult.reason);
    }
  }

  tick();
  setInterval(tick, REFRESH_MS);
</script>

</body>
</html>
