name: Scrape NEPSE Live Prices

permissions:
  contents: write

on:
  schedule:
    # Runs every 15 min, 05:15-09:15 UTC, Sun-Thu (~11:00-15:00 Nepal time)
    # NEPSE trading hours/days can change — double check and adjust this.
    - cron: "15,30,45 5 * * 0-4"
    - cron: "*/15 6-8 * * 0-4"
    - cron: "0,15 9 * * 0-4"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape_nepse.py

      - name: Publish refreshed static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data.json
          git diff --cached --quiet || git commit -m "Update NEPSE price snapshot"
          git push

  ipo-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements-supabase.txt

      - name: Sync IPO alerts to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/scrape_ipo.py

      - name: Send Telegram IPO alerts
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scraper/telegram_bot.py --send-alerts
          python scraper/telegram_bot.py --send-reminders
